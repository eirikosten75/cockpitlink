# Builds CockpitLink.exe on GitHub from the source code and attaches the zip to the release,
# so anyone can see exactly which code the exe was built from.
name: Build exe

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (leave empty to build the current branch)"
        required: false
        default: ""
      attach:
        description: "Attach the zip to the release (untick to only build a test artifact)"
        type: boolean
        default: true
      package_version:
        description: "Store package version (e.g. 3.2.1.0) – leave empty to use the program version"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        shell: pwsh
        run: |
          # Tags made before requirements-build.txt existed use the pinned versions from this workflow's commit.
          if (-not (Test-Path requirements-build.txt)) { git checkout "${{ github.sha }}" -- requirements-build.txt }
          # The README in the zip is the latest one (docs only – the program is built from the tag).
          git checkout "${{ github.sha }}" -- README.md
          # PyInstaller is installed below with a bootloader compiled here; the rest comes from the pinned list.
          Get-Content requirements-build.txt | Where-Object { $_ -notmatch '^\s*pyinstaller\s*==' } | Set-Content req-other.txt
          python -m pip install -r req-other.txt

      # The prebuilt PyInstaller bootloader is shared by countless exes (including malware), so
      # machine-learning virus scanners often flag anything that uses it. Compiling our own bootloader
      # from PyInstaller's source gives a unique, clean binary and far fewer false positives.
      - name: Build PyInstaller with its own bootloader
        shell: pwsh
        run: |
          $ver = (Select-String -Path requirements-build.txt -Pattern '^\s*pyinstaller\s*==\s*([\d.]+)').Matches[0].Groups[1].Value
          git clone --depth 1 --branch "v$ver" https://github.com/pyinstaller/pyinstaller.git "$env:RUNNER_TEMP\pyinstaller"
          Push-Location "$env:RUNNER_TEMP\pyinstaller\bootloader"
          python ./waf all --target-arch=64bit
          if ($LASTEXITCODE -ne 0) { throw "Bootloader build failed" }
          Pop-Location
          python -m pip install "$env:RUNNER_TEMP\pyinstaller"
          python -m PyInstaller --version

      - name: Build the exe
        shell: pwsh
        run: |
          ./build.ps1
          if (-not (Test-Path CockpitLink.exe)) { throw "The build did not produce CockpitLink.exe" }

      - name: Make the zip
        id: zip
        shell: pwsh
        run: |
          $name = if ($env:TAG) { "CockpitLink-$env:TAG.zip" } else { "CockpitLink-${{ github.sha }}.zip" }
          Compress-Archive -Path CockpitLink.exe, config.example.json, README.md, LICENSE -DestinationPath $name
          "name=$name" >> $env:GITHUB_OUTPUT
          $exe = (Get-FileHash CockpitLink.exe -Algorithm SHA256).Hash
          $zip = (Get-FileHash $name -Algorithm SHA256).Hash
          "### Build of ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}" >> $env:GITHUB_STEP_SUMMARY
          "Source commit: ``$(git rev-parse HEAD)`` · PyInstaller bootloader compiled in this run" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| File | SHA-256 |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          "| CockpitLink.exe | ``$exe`` |" >> $env:GITHUB_STEP_SUMMARY
          "| $name | ``$zip`` |" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.name }}

      # The Microsoft Store package (unsigned – the Store signs it on submission). Only for versions that have msix/.
      - name: Make the Microsoft Store package (MSIX)
        id: msix
        if: hashFiles('msix/build-msix.ps1') != ''
        shell: pwsh
        env:
          CL_PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          ./msix/build-msix.ps1 -Exe CockpitLink.exe
          $file = Get-ChildItem CockpitLink-*.msix | Select-Object -First 1
          "name=$($file.Name)" >> $env:GITHUB_OUTPUT
          "| $($file.Name) | ``$((Get-FileHash $file -Algorithm SHA256).Hash)`` |" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: steps.msix.outputs.name != ''
        with:
          name: ${{ steps.msix.outputs.name }}
          path: ${{ steps.msix.outputs.name }}

      - name: Attach the zip to the release
        if: env.TAG != '' && (github.event_name == 'release' || inputs.attach)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG" "${{ steps.zip.outputs.name }}" --clobber
