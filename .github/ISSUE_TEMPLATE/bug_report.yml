name: Bug report
description: Something does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the *Troubleshooting* section in the README first.
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown next to the title in the control panel and at the top of the tray icon's menu.
      placeholder: "1.3.1"
    validations:
      required: true
  - type: dropdown
    id: run
    attributes:
      label: How do you run it?
      options:
        - CockpitLink.exe
        - From Python (cockpitlink.py)
    validations:
      required: true
  - type: dropdown
    id: sim
    attributes:
      label: Simulator
      options:
        - MSFS 2024
        - MSFS 2020
        - Not relevant (API / LED setup only)
    validations:
      required: true
  - type: input
    id: aircraft
    attributes:
      label: Aircraft
      placeholder: "e.g. A2A Comanche 250"
  - type: input
    id: devices
    attributes:
      label: Virpil devices
      description: Name and PID (from VPC Configuration Tool or config.json).
      placeholder: "e.g. Control Panel #2 (025B), MongoosT-50CM3 throttle (0198)"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce help a lot.
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: Rule or config (if relevant)
      description: The rule from config.json that misbehaves.
      render: json
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Relevant lines from the Log panel or bridge.log. bridge.log can contain your Windows user name in file paths –
        remove anything you do not want to share.
      render: text
